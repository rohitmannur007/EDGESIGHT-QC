name: Security

on:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.5.21"
      - run: uv python install 3.11
      - run: uv sync --frozen
      - name: Audit installed dependencies
        run: uv run pip-audit

  image-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t edgesight-qc:scan .
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: edgesight-qc:scan
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
