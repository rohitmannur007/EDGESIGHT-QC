name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.21"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.11
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Environment
        run: uv run python scripts/check_env.py
      - name: Lint
        run: make lint
      - name: Format check
        run: uv run ruff format --check scripts
      - name: Type check
        run: make typecheck
      - name: Test
        run: make test

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: edgesight-qc:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
