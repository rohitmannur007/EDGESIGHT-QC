[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "edgesight-qc"
version = "0.1.0"
description = "Edge-first visual quality-control reference system"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "EdgeSight-QC contributors" }]
dependencies = [
  "fastapi>=0.143.1,<0.144",
  "uvicorn[standard]>=0.38.0,<0.39",
  "python-multipart>=0.0.20,<0.1",
  "duckdb>=1.1.0,<2",
  "pydantic>=2.10.0,<3",
  "pydantic-settings>=2.7.0,<3",
  "PyYAML>=6.0.2,<7",
  "numpy>=1.26.4,<2.1",
  "pillow>=10.4.0,<12",
  "opencv-python-headless>=4.10.0.84,<5",
  "httpx>=0.28.0,<0.29",
  "typer>=0.15.0,<0.16",
  "rich>=13.9.0,<14",
  "prometheus-client>=0.21.0,<0.22",
  "structlog>=24.4.0,<26",
]

[project.optional-dependencies]
ml = [
  "torch>=2.14.1,<2.15",
  "torchvision>=0.29.1,<0.30",
  "scikit-learn>=1.5.0,<1.7",
  "scipy>=1.13.0,<1.16",
  "pandas>=2.2.0,<2.3",
  "matplotlib>=3.9.0,<3.11",
  "ultralytics>=8.4.177,<8.5",
  "onnx>=1.17.0,<2",
  "onnxscript>=0.5.0,<1",
  "onnxruntime>=1.20.0,<2",
]
stream = [
  "confluent-kafka>=2.6.0,<3",
  "tenacity>=9.0.0,<10",
]
cloud = [
  "google-cloud-storage>=2.18.0,<4",
  "google-cloud-logging>=3.11.0,<4",
]
ui = [
  "streamlit>=1.41.0,<2",
  # PyArrow 19+ requires NumPy 2, which this environment cannot use alongside Torch.
  "pyarrow>=16.1.0,<19",
]
dev = [
  "pytest>=8.3.0,<9",
  "pytest-cov>=6.0.0,<7",
  "ruff>=0.9.0,<0.10",
  "mypy>=1.14.0,<2",
  "types-PyYAML>=6.0.12,<7",
  "pre-commit>=4.0.0,<5",
  "pip-audit>=2.7.0,<3",
]

[project.scripts]
edgesight = "edgesight.cli:main"

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9",
  "pytest-cov>=6.0.0,<7",
  "ruff>=0.9.0,<0.10",
  "mypy>=1.14.0,<2",
  "types-PyYAML>=6.0.12,<7",
  "pre-commit>=4.0.0,<5",
  "pip-audit>=2.7.0,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/edgesight"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["data", "models", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=edgesight --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["scripts"]
exclude = ["data/", "models/", "results/"]

[[tool.mypy.overrides]]
module = ["edgesight.*", "torch", "torch.*"]
ignore_missing_imports = true
